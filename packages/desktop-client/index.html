<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Actual</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link
      rel="manifest"
      href="/site.webmanifest"
      crossorigin="use-credentials"
    />
    <meta name="msapplication-TileColor" content="#5c3dbb" />
    <meta name="theme-color" content="#5c3dbb" />

    <style type="text/css">
      html,
      body {
        margin: 0;
        padding: 0;
        font-size: 15px;
      }

      html,
      body,
      button,
      input {
        font-family: var(
          --font-family,
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          'Helvetica',
          'Arial',
          sans-serif
        );
      }

      a {
        color: inherit;
        text-decoration-skip: ink;
      }

      * {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
      }

      *:focus {
        /* colors.b5 */
        outline-color: #2b8fed;
      }

      input,
      textarea {
        font-size: 1em;
        font-family: var(
          --font-family,
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          'Helvetica',
          'Arial',
          sans-serif
        );
        font-feature-settings:
          'ss01',
          'ss04',
          'calt' 0;
      }

      html,
      body,
      #root {
        height: 100%;
      }
      body {
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 12% 88%,
            rgba(140, 165, 200, 0.55) 0%,
            transparent 35%
          ),
          radial-gradient(
            ellipse at 92% 4%,
            rgba(185, 170, 225, 0.35) 0%,
            transparent 28%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            rgba(210, 205, 215, 0.2) 0%,
            transparent 55%
          ),
          linear-gradient(155deg, #eae6e3 0%, #ddd8d5 100%);
      }

      .cm-theme-dark {
        height: 100%;
      }

      .cm-theme-light {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
